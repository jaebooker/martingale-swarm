[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "martingale-audit"
version = "0.2.0"
description = "Swarm trace audits with conditional betting tests and solver-checked kernel obligations"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic"]
hf = ["datasets"]
plot = ["matplotlib"]
dev = ["pytest"]
verify = ["z3-solver>=4.12"]

[project.scripts]
martingale-audit = "martingale_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
